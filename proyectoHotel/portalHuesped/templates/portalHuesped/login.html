{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión Huésped</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style></style>


<body class="container py-5">
  <h1 class="mb-4">Portal de Huésped - Iniciar Sesión</h1>
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
  {% endfor %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input type="text" name="username" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button class="btn btn-primary" type="submit">Entrar</button>
    <a href="{% url 'registro_huesped' %}" class="btn btn-link">Registrarme</a>
    <a href="{% url 'portal_index' %}" class="btn btn-link">Volver al menú principal</a>
  </form>
</body>
</html>
