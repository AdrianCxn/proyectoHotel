{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión - Hotel Elegante</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'portalHuesped/styles.css' %}" rel="stylesheet">
</head>

<body>
  <div class="main-container">
    <div class="text-center mb-4">
      <h1 style="margin-bottom: 10px;">Iniciar Sesión</h1>
      <p style="color: #6d4c41; font-size: 1.1rem; font-style: italic; margin-bottom: 30px;">Hotel Irisvago</p>
    </div>
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} text-center">{{ message }}</div>
    {% endfor %}
    
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card" style="border: 2px solid rgba(215, 177, 130, 0.3);">
          <div class="card-body">
            <h4 class="text-center mb-4" style="color: #350d67; font-weight: 600; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Acceda a su Cuenta</h4>
            
            <form method="post">
              {% csrf_token %}
              
              <div class="mb-4">
                <div class="form-floating">
                  <input type="text" name="username" class="form-control" id="username" required style="border-color: rgba(215, 177, 130, 0.5);" placeholder="Usuario">
                  <label for="username" style="color: #350d67; font-weight: 500;">Nombre de Usuario</label>
                </div>
              </div>
              
              <div class="mb-4">
                <div class="form-floating">
                  <input type="password" name="password" class="form-control" id="password" required style="border-color: rgba(215, 177, 130, 0.5);" placeholder="Contraseña">
                  <label for="password" style="color: #350d67; font-weight: 500;">Contraseña</label>
                </div>
              </div>
              
              <div class="d-grid mb-4">
                <button class="btn btn-primary btn-lg" type="submit" style="background: #350d67; border: none; font-weight: 600; padding: 15px;">
                  Iniciar Sesión
                </button>
              </div>
            </form>
            
            <hr style="border-color: rgba(215, 177, 130, 0.3);">
            
            <div class="text-center">
              <p style="color: #6d4c41; margin-bottom: 15px;">¿No tiene una cuenta?</p>
              <a href="{% url 'registro_huesped' %}" class="btn btn-success me-2" style="font-weight: 600;">
                Crear Cuenta
              </a>
              <a href="{% url 'portal_index' %}" class="btn btn-outline-secondary" style="border-color: #6d4c41; color: #6d4c41; font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif">
                Volver al Inicio
              </a>
            </div>
          </div>
        </div>
      
      </div>
    </div>
    
    <div style="text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(215, 177, 130, 0.3);">
      <p style="font-style: italic; color: #6d4c41; font-size: 0.9rem;">Acceso - Hotel Irisvago</p>
    </div>
  </div>
</body>
</html>
