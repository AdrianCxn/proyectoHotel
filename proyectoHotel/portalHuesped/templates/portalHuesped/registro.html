{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Huésped</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
  <h1 class="mb-4">Crear Cuenta de Huésped</h1>
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
  {% endfor %}
  <form method="post">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" required>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Primer Apellido</label>
        <input type="text" name="pr_apellido" class="form-control" required>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Segundo Apellido</label>
        <input type="text" name="se_apellido" class="form-control" required>
      </div>
            <div class="col-md-4 mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Teléfono</label>
        <input type="text" name="telefono" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Edad</label>
        <input type="number" name="edad" min="18" class="form-control" required>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required>
      </div>
    </div>
    <button class="btn btn-success" type="submit">Registrar</button>
    <a href="{% url 'login_huesped' %}" class="btn btn-link">Volver a Iniciar Sesión</a>
  </form>
</body>
</html>
