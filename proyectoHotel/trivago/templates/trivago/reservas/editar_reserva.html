{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="{% static 'trivago/rest_style.css' %}">
	<title>Editar | Habitaciones</title>
</head>

<style>
	body {
		font-family: Arial, Helvetica, sans-serif;
		display: flex;
		min-height: 100vh;
		padding: 50px 15px;
		justify-content: center;
		align-items: center;
		background: rgb(10, 15, 60);
		background: linear-gradient(135deg, rgb(36, 44, 112) 0%, rgb(10, 15, 60) 55%);
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	}

	.main-container {
		max-width: 700;
		background-color: #fff;
		display: flex;
		border-radius: 10px;
		overflow: hidden;
	}

	.container {
		padding: 30px 40px;
		width: 400px;
		background-color: #fff;
	}

	.container h1 {
		font-size: 30px;
		letter-spacing: 0px;
		font-weight: 700;
		text-align: center;
		color: rgb(10, 15, 60);
		position: relative;
		text-transform: uppercase;
		margin-bottom: 30px;
	}

	input {
		width: 100%;
		padding: 8px;
		margin-bottom: 15px;
		border: 1px solid rgb(36, 44, 112);
		border-radius: 5px;
		box-sizing: border-box;
		resize: vertical;
		font-size: 15px;
	}

	label {
		font-size: 15px;
		display: block;
		padding: 5px 0px;
		margin-right: 10px;
		margin-bottom: 5px;
		font-weight: bold;
		font-size: large;
		color: rgb(21, 43, 84);
	}

	.select-actions {
    display: flex;
    gap: 20px;
    justify-content: space-between; /* los separa uniformemente */
    margin-bottom: 20px;
}

.select-actions .mb-3 {
    flex: 1; /* que cada select ocupe la mitad del contenedor */
}

	select {
		width: 100%;
		padding: 8px;
		border: 1px solid rgb(36, 44, 112);
		border-radius: 5px;
		background-color: #f1f1f1;
		margin-bottom: 10px;
		font-size: 15px;
	}

	.form-actions {
		display: flex;
		gap: 10px;
		justify-content: center;
		margin-top: 20px;
	}

	a,
	.container button {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		background: linear-gradient(135deg, rgb(36, 44, 112) 0%, rgb(10, 15, 60) 55%);
		color: #fff;
		border: none;
		font-size: 20px;
		font-weight: 600;
		padding: 12px 20px;
		border-radius: 12px;
		cursor: pointer;
		transition: all 0.5s;
		text-decoration: none;
	}


	a:hover,
	.container button:hover {
		opacity: 0.8;
	}

	.image {
		width: 300px;
		height: auto;
		flex-shrink: 0;
	}

	.image img {
		width: 100%;
		height: 100%;
		object-fit: cover;
		display: block;
	}
</style>

<body>
	<!-- Menu -->
	<div class="preload">
		<div class="preload-wave"></div>
	</div>

	<div class="main-container">
		<div class="container">

			<h1>Editar reserva ID: {{ reserva.id_reserva }} </h1>
			{% if messages %}
				<div class="messages">
					{% for message in messages %}
						<div class="alert alert-info">{{ message }}</div>
					{% endfor %}
				</div>
			{% endif %}
			<form method="POST" class="mb-4">
				{% csrf_token %}

				<div class="mb-3">
					<label class="form-label">Habitación</label>
					<select name="habitacion" class="form-control" required>
						{% for h in habitaciones %}
							<option value="{{ h.id_habitacion }}"
								{% if h.id_habitacion == reserva.id_habitacion.id_habitacion %}selected{% endif %}>
								Habitación {{ h.numero }} | Tipo: {{ h.id_tipo.tipo }} | Precio: ${{ h.id_tipo.precio }}
							</option>
						{% endfor %}
					</select>
				</div>

                <div class="mb-3">
					<label class="form-label">Cantidad Adultos</label>
					<input type="number" name="cantidad_a" id="cantidad_a" min="1" max="6" value="{{ reserva.cantidad_a }}"
						class="form-control" placeholder="" required>
				</div>

                <div class="mb-3">
					<label class="form-label">Cantidad Niños</label>
					<input type="number" name="cantidad_n" id="cantidad_n" min="0" max="5" value="{{ reserva.cantidad_n }}"
						class="form-control" placeholder="" required>
				</div>

				<div class="mb-3">
					<label class="form-label">Método de Pago</label>
						<select name="metodo_pago" class="form-control" required>
							<option value="">-- Selecciona --</option>
							<option value="Credito" {% if reserva.metodo_pago == 'Credito' %}selected{% endif %}>Crédito</option>
							<option value="Efectivo" {% if reserva.metodo_pago == 'Efectivo' %}selected{% endif %}>Efectivo</option>
							<option value="Debito" {% if reserva.metodo_pago == 'Debito' %}selected{% endif %}>Débito</option>
						</select>
				</div>

				<div class="mb-3">
					<label class="form-label">Estado</label>
					<select name="estado" class="form-control" required>
						<option value="1" {% if reserva.activa == 1 or reserva.activa == '1' or reserva.activa == True %}selected{% endif %}>Activa</option>
						<option value="0" {% if reserva.activa == 0 or reserva.activa == '0' or reserva.activa == False %}selected{% endif %}>Cerrada</option>
					</select>
				</div>

				<div class="form-actions">
					<a href="{% url 'reservas' %}" class="btn btn-secondary">Cancelar</a>
					<button type="submit" class="btn btn-primary">Aplicar cambios</button>
				</div>
			</form>
		</div>
		<div class="image">
			<img src="https://remindshospitality.com/wp-content/uploads/2021/10/shutterstock_1566785659-1.jpg" alt="Titulo">
		</div>
	</div>
</html>
