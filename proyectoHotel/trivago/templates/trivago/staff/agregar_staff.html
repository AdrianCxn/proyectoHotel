{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="{% static 'trivago/rest_style.css' %}">
	<title>Agregar | Staff</title>
</head>

<style>
	body {
		font-family: Arial, Helvetica, sans-serif;
		display: flex;
		min-height: 100vh;
		padding: 50px 15px;
		justify-content: center;
		align-items: center;
		background: rgb(10, 15, 60);
		background: linear-gradient(135deg, rgb(36, 44, 112) 0%, rgb(10, 15, 60) 55%);
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	}

	.main-container {
		max-width: 700;
		background-color: #fff;
		display: flex;
		border-radius: 10px;
		overflow: hidden;
	}

	.container {
		padding: 30px 40px;
		width: 300px;
		background-color: #fff;
	}

	.container h1 {
		font-size: 25px;
		letter-spacing: 0px;
		font-weight: 700;
		text-align: center;
		color: rgb(10, 15, 60);
		position: relative;
		text-transform: uppercase;
		margin-bottom: 40px;
	}

	input {
		width: 100%;
		padding: 8px;
		margin-bottom: 15px;
		border: 1px solid rgb(36, 44, 112);
		border-radius: 5px;
		box-sizing: border-box;
		resize: vertical;
		font-size: 15px;
	}

	label {
		font-size: 15px;
		display: block;
		padding: 5px 0px;
		margin-right: 10px;
		margin-bottom: 5px;
		font-weight: bold;
		font-size: large;
		color: rgb(21, 43, 84);
	}

	select {
		width: 100%;
		padding: 8px;
		border: 1px solid rgb(36, 44, 112);
		border-radius: 5px;
		background-color: #f1f1f1;
		margin-bottom: 30px;
		font-size: 15px;
	}

	.form-actions {
		display: flex;
		gap: 10px;
		justify-content: center;
		margin-top: 20px;
	}

	a,
	.container button {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		background: linear-gradient(135deg, rgb(36, 44, 112) 0%, rgb(10, 15, 60) 55%);
		color: #fff;
		border: none;
		font-size: 20px;
		font-weight: 600;
		padding: 12px 20px;
		border-radius: 12px;
		cursor: pointer;
		transition: all 0.5s;
		text-decoration: none;
	}


	a:hover,
	.container button:hover {
		opacity: 0.8;
	}

	.image {
		width: 300px;
		height: auto;
		flex-shrink: 0;
	}

	.image img {
		width: 100%;
		height: 100%;
		object-fit: cover;
		display: block;
	}
</style>

<body>
	<!-- Menu -->
	<div class="preload">
		<div class="preload-wave"></div>
	</div>


	<div class="main-container">
		<div class="container">
			<h1>Agregar staff</h1>
			{% if messages %}
				<div class="messages">
					{% for message in messages %}
						<div class="alert alert-info">{{ message }}</div>
					{% endfor %}
				</div>
			{% endif %}
			<form method="POST" class="mb-4">
				{% csrf_token %}
				<div class="mb-3">
					<label class="form-label">Nombre</label>
					<input type="text" name="nombre" maxlength="100" required>
				</div>

				<div class="mb-3">
					<label class="form-label">Apellido Paterno</label>
					<input type="text" name="pr_apellido" maxlength="100" required>
				</div>

                <div class="mb-3">
					<label class="form-label">Apellido Materno (opcional)</label>
					<input type="text" name="se_apellido" maxlength="100">
				</div>

                <div class="mb-3">
					<label class="form-label">Teléfono</label>
					<input type="text" name="telefono" maxlength="20" pattern="[0-9]+" required>
				</div>

				<div class="mb-3">
					<label class="form-label">Correo electrónico</label>
					<input type="email" name="email" maxlength="100" required>
				</div>

				<div class="mb-3">
					<label class="form-label">Edad</label>
					<input type="number" name="edad" min="18" max="130" pattern="[0-9]+" required>
				</div>

                <div class="mb-3">
					<label class="form-label">Área de trabajo (opcional)</label>
					<input type="text" name="area_trabajo" maxlength="100">
				</div>

                <div class="mb-3">
					<label class="form-label">Salario</label>
					<input type="text" name="salario" maxlength="10" pattern="\$?[0-9]+(\.[0-9]{2})?" required>
				</div>

                <div class="mb-3">
					<label class="form-label">Turno (opcional)</label>
					<input type="text" name="turno" maxlength="100">
				</div>

				<div class="form-actions">
					<a href="{% url 'staff' %}" class="btn btn-secondary">Cancelar</a>
					<button type="submit" class="btn btn-primary">Agregar</button>
				</div>

			</form>
		</div>
		<div class="image">
			<img src="https://th.bing.com/th/id/R.1e3f16dc104230547a8ba7888e0f08fb?rik=1UGfcmLbNUIH7g&pid=ImgRaw&r=0" alt="Titulo">
		</div>
	</div>
</html>
